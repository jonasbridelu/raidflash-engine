[project]
name = "raidflash"
version = "0.3.0"
description = "RAIDFLASH 1.1: one job fills idle GPU streams until the knee (2.45× decode on 2×GB10 GLM-5.3-Flash)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jonathan Briceño De Luise" }]
keywords = ["llm", "inference", "speculative-decoding", "prefill", "occupancy"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jonasbridelu/raidflash-engine"
Company = "https://cakeinfraestructure.com"
Thesis = "docs/OCCUPANCY.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
