[project]
name = "raidflash"
version = "0.1.1"
description = "Fill every free GPU stream of one user until throughput stops scaling."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Johann", email = "raidflash@cake" }]
keywords = ["llm", "inference", "speculative-decoding", "prefill", "occupancy"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/raidflash/raidflash-engine"
Thesis = "docs/OCCUPANCY.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
